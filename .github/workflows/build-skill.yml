name: Build simple skill

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-skill
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if references/ or assets/ have drifted between variants.
      - name: Build job-app.skill
        run: bash scripts/build-skill.sh

      - uses: actions/upload-artifact@v7
        with:
          name: job-app-skill
          path: job-app-simple/job-app.skill
          if-no-files-found: error

      # Workflow artifacts need a GitHub login to download and expire, so also
      # publish to a fixed release whose download URL never changes:
      # https://github.com/<owner>/<repo>/releases/download/job-app-skill/job-app.skill
      - name: Publish to the job-app-skill release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete job-app-skill --cleanup-tag --yes || true
          gh release create job-app-skill job-app-simple/job-app.skill \
            --target "$GITHUB_SHA" \
            --title "job-app skill for claude.ai" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Upload job-app.skill in claude.ai under Settings → Capabilities → Skills."
